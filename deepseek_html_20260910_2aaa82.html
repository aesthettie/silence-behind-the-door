<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тишина за дверью — Психологический квест</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #d4af37; /* Золотой свет */
            --secondary-text-color: #888;
            --font-main: 'Lora', serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* --- Атмосферный фон --- */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1509373247324-3b3c8c9c1e7e?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(18,18,18,0) 0%, rgba(18,18,18,1) 80%);
            z-index: -1;
        }

        /* --- Структура --- */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            z-index: 1;
        }

        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #f0f0f0;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin: 0;
            animation: fadeIn 2s ease-in-out;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: var(--secondary-text-color);
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
            font-style: italic;
            animation: fadeIn 2s ease-in-out 0.5s forwards;
            opacity: 0;
        }

        /* --- Секция с видео --- */
        .trailer-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 3rem;
            animation: fadeIn 2s ease-in-out 1s forwards;
            opacity: 0;
        }

        .video-placeholder {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            background-color: #000;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-placeholder:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }

        .video-placeholder iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            border: 2px solid rgba(255,255,255,0.5);
            transition: background 0.3s, transform 0.3s;
            z-index: 2;
        }
        
        .video-placeholder:hover .play-button {
            background: rgba(212, 175, 55, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* --- Секция с загрузкой --- */
        .download-section {
            animation: fadeIn 2s ease-in-out 1.5s forwards;
            opacity: 0;
        }

        .download-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .download-button:hover {
            background-color: #e6c65a;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
        }

        .download-note {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--secondary-text-color);
        }

        /* --- Анимации --- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .play-button {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <h1>ТИШИНА ЗА ДВЕРЬЮ</h1>
            <p class="subtitle">всему свое время</p>
        </header>

        <section class="trailer-section">
            <!-- 
              ВАЖНО: Замени ссылку в src на ссылку на твой трейлер на YouTube.
              Чтобы получить ссылку для встраивания: 
              1. Открой видео на YouTube.
              2. Нажми "Поделиться" -> "Встроить".
              3. Скопируй только часть ссылки, которая находится внутри src="".
            -->
            <div class="video-placeholder" onclick="loadVideo()">
                <div class="play-button">▶</div>
            </div>
        </section>

        <section class="download-section">
            <!-- 
              ВАЖНО: Замени href="#" на ссылку, откуда можно будет скачать игру.
              Это может быть ссылка на Яндекс.Диск, Google Drive, itch.io или любой другой файлообменник.
            -->
            <a href="#" class="download-button" download>Скачать игру</a>
            <p class="download-note">Для Windows / macOS<br>Версия 1.0</p>
        </section>
    </div>

    <script>
        // Этот скрипт подгружает видео только после клика, чтобы не замедлять загрузку страницы.
        function loadVideo() {
            const placeholder = document.querySelector('.video-placeholder');
            
            // Ссылка на встраиваемое видео. Замени на свою.
            // Например, 'https://www.youtube.com/embed/ВАШ_ID_ВИДЕО'
            const videoUrl = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1'; 
            
            // Создаем iframe
            const iframe = document.createElement('iframe');
            iframe.setAttribute('src', videoUrl);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');
            
            // Очищаем placeholder и добавляем видео
            placeholder.innerHTML = ''; 
            placeholder.appendChild(iframe);
            
            // Убираем обработчик клика, чтобы видео не перезагружалось при повторном клике
            placeholder.onclick = null;
        }
    </script>
</body>
</html>
